<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eloboth - Agente Inteligente</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%230d1330%22/><rect x=%2216%22 y=%2222%22 width=%2268%22 height=%2254%22 rx=%2214%22 fill=%22%23232a4a%22/><rect x=%2230%22 y=%2243%22 width=%2212%22 height=%2216%22 rx=%226%22 fill=%22%2300e5ff%22/><rect x=%2258%22 y=%2243%22 width=%2212%22 height=%2216%22 rx=%226%22 fill=%22%2300e5ff%22/></svg>">
<style>
  :root {
    --bg: #070b1a;
    --bg2: #0d1330;
    --panel: #111a3a;
    --panel-2: #172249;
    --cuerpo: #1f2640;
    --cuerpo-claro: #2b3558;
    --texto: #e6ecff;
    --suave: #8b97c4;
    --borde: rgba(120, 140, 255, .18);
    --cian: #00e5ff;
    --cian-suave: rgba(0, 229, 255, .35);
    --violeta: #6c4cff;
    --violeta-2: #9a5cff;
    --glow: 0 0 24px rgba(0, 229, 255, .25);
    --sombra: 0 10px 40px rgba(0, 0, 0, .45);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--texto);
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(108, 76, 255, .25), transparent 60%),
      radial-gradient(800px 500px at 110% 110%, rgba(0, 229, 255, .18), transparent 60%),
      var(--bg);
    display: flex; flex-direction: column; overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5;
    background-image:
      linear-gradient(rgba(120, 140, 255, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 140, 255, .05) 1px, transparent 1px);
    background-size: 36px 36px;
    mask-image: radial-gradient(ellipse at center, #000 40%, transparent 80%);
  }
  button, textarea, input { font: inherit; color: inherit; }
  button { cursor: pointer; transition: transform .15s, box-shadow .2s, background .2s, border-color .2s; }
  button:active { transform: scale(.97); }

  /* ---------- Robot face (reutilizable) ---------- */
  .robot {
    position: relative; display: grid; place-items: center;
    background: linear-gradient(160deg, #2c3557, #151b33);
    border: 1px solid rgba(255,255,255,.06);
    box-shadow: inset 0 2px 6px rgba(255,255,255,.08), 0 6px 18px rgba(0,0,0,.4);
  }
  .robot .pantalla {
    position: absolute; background: #05070f;
    box-shadow: inset 0 0 0 2px #39416b, 0 0 0 1px rgba(255,255,255,.05);
  }
  .robot .ojos { display: flex; gap: 14%; align-items: center; justify-content: center; }
  .robot .ojo {
    background: var(--cian); border-radius: 30%;
    box-shadow: 0 0 10px var(--cian), 0 0 22px rgba(0,229,255,.55);
    animation: parpadeo 5s infinite;
  }
  .robot .ojo.der { animation-delay: .08s; }
  @keyframes parpadeo {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(.1); }
  }
  .robot .auricular {
    position: absolute; top: -18%; left: -10%; right: -10%; height: 58%;
    border: 6px solid var(--violeta); border-bottom: 0; border-radius: 999px 999px 0 0;
    box-shadow: 0 0 14px rgba(108,76,255,.5);
    pointer-events: none;
  }

  /* ---------- Header ---------- */
  header {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 14px; padding: 12px 22px;
    background: rgba(13, 19, 48, .75); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--borde);
  }
  .avatar { width: 46px; height: 46px; border-radius: 14px; flex-shrink: 0; }
  .avatar .pantalla { inset: 20% 16%; border-radius: 8px; }
  .avatar .ojo { width: 6px; height: 9px; }
  .avatar .ojos { position: absolute; inset: 0; }
  .avatar .auricular { top: -14%; left: -6%; right: -6%; height: 50%; border-width: 3px; }
  .marca { flex: 1; min-width: 0; }
  .marca b { display: block; font-size: 17px; letter-spacing: .3px; }
  .estado { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--suave); }
  .punto { width: 7px; height: 7px; border-radius: 50%; background: #3dffa2; box-shadow: 0 0 8px #3dffa2; animation: pulso 2s infinite; }
  @keyframes pulso { 50% { opacity: .4; } }

  .boton {
    padding: 8px 14px; border-radius: 10px; border: 1px solid var(--borde);
    background: rgba(255,255,255,.03); font-size: 14px; font-weight: 500;
  }
  .boton:hover { border-color: var(--cian-suave); box-shadow: var(--glow); }
  .boton.principal {
    background: linear-gradient(135deg, var(--violeta), var(--cian));
    border: 0; color: #04101a; font-weight: 700;
  }
  .boton.principal:hover { box-shadow: 0 0 22px rgba(0,229,255,.45); }

  /* ---------- Login ---------- */
  #login-container {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1; gap: 18px; text-align: center; padding: 24px; max-width: 480px; margin: 0 auto; width: 100%;
  }
  .login-robot { width: 150px; height: 150px; border-radius: 42px; }
  .login-robot .pantalla { inset: 26% 18%; border-radius: 22px; }
  .login-robot .ojo { width: 26px; height: 36px; }
  .login-robot .auricular { top: -16%; left: -12%; right: -12%; height: 52%; border-width: 10px; }
  .login-robot .ojos { position: absolute; inset: 0; }
  #login-container h2 {
    margin: 6px 0 0; font-size: 28px; letter-spacing: -.3px;
    background: linear-gradient(90deg, #fff, var(--cian));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #login-container p { margin: 0; color: var(--suave); line-height: 1.6; font-size: 15px; }
  .campo {
    padding: 14px 18px; border-radius: 12px; border: 1px solid var(--borde);
    background: var(--bg2); font-size: 16px; width: 100%; text-align: center; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .campo:focus { border-color: var(--cian); box-shadow: var(--glow); }
  #loginBtn { width: 100%; padding: 14px; font-size: 15px; border-radius: 12px; }

  /* ---------- Chat ---------- */
  #chat { position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 28px 18px; display: none; scroll-behavior: smooth; }
  #mensajes { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .fila-msg { display: flex; gap: 10px; align-items: flex-end; animation: entrar .35s ease; }
  .fila-msg.usuario { justify-content: flex-end; }
  @keyframes entrar { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .mini-robot { width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0; }
  .mini-robot .pantalla { inset: 22% 14%; border-radius: 6px; }
  .mini-robot .ojo { width: 4px; height: 6px; }
  .mini-robot .ojos { position: absolute; inset: 0; }
  .mini-robot .auricular { top: -16%; left: -8%; right: -8%; height: 50%; border-width: 2px; }

  .msg {
    max-width: 78%; padding: 13px 17px; border-radius: 18px; line-height: 1.6;
    word-break: break-word; font-size: 15px; white-space: pre-wrap;
  }
  .usuario.msg {
    background: linear-gradient(135deg, var(--violeta), #3a5bff);
    color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 6px 20px rgba(108,76,255,.3);
  }
  .eloboth.msg {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--borde); border-bottom-left-radius: 4px;
    box-shadow: var(--sombra); font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 14px;
  }
  .eloboth.msg::before {
    content: "eloboth@chat:~$ "; display: block; color: var(--cian); font-size: 12px; opacity: .8; margin-bottom: 6px;
  }
  .eloboth.pensando { color: var(--suave); }
  .eloboth.pensando::before { content: none; }
  .puntos span {
    display: inline-block; width: 6px; height: 6px; margin: 0 3px; border-radius: 50%;
    background: var(--cian); animation: rebote 1.2s infinite ease-in-out;
  }
  .puntos span:nth-child(2) { animation-delay: .15s; }
  .puntos span:nth-child(3) { animation-delay: .3s; }
  @keyframes rebote { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-5px); opacity: 1; } }

  pre { background: #05070f; color: #bfe9ff; padding: 14px; border-radius: 10px; overflow-x: auto; border: 1px solid var(--borde); margin: 8px 0 0; }
  code { font-family: ui-monospace, Consolas, monospace; background: rgba(0,229,255,.08); color: var(--cian); padding: 2px 6px; border-radius: 6px; }

  /* ---------- Entrada ---------- */
  #entrada {
    position: relative; z-index: 2;
    background: rgba(13, 19, 48, .8); backdrop-filter: blur(10px);
    border-top: 1px solid var(--borde); padding: 16px; display: none;
  }
  #entrada .fila {
    max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
    background: var(--bg2); border: 1px solid var(--borde); border-radius: 16px; padding: 8px 8px 8px 16px;
    transition: border-color .2s, box-shadow .2s;
  }
  #entrada .fila:focus-within { border-color: var(--cian-suave); box-shadow: var(--glow); }
  #texto {
    flex: 1; min-width: 0; resize: none; min-height: 44px; max-height: 180px; padding: 10px 0;
    border: 0; background: transparent; outline: none;
  }
  #texto::placeholder { color: var(--suave); }
  #enviar { padding: 11px 20px; border-radius: 12px; }

  /* ---------- Layout con barra de conversaciones ---------- */
  #cuerpo { position: relative; z-index: 1; flex: 1; display: flex; min-height: 0; }
  #principal { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #barra {
    width: 260px; flex-shrink: 0; display: none; flex-direction: column; gap: 12px; padding: 14px;
    background: rgba(13, 19, 48, .7); border-right: 1px solid var(--borde); min-height: 0;
  }
  body.con-sesion #barra { display: flex; }
  #barra h3 {
    margin: 6px 4px 0; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--suave);
  }
  #nuevaChat { width: 100%; padding: 10px; border-radius: 12px; }
  #listaChats { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .chat-item {
    display: flex; align-items: center; gap: 6px; padding: 10px; border-radius: 10px;
    cursor: pointer; border: 1px solid transparent;
  }
  .chat-item:hover { background: rgba(255, 255, 255, .04); }
  .chat-item.activo { border-color: var(--cian-suave); background: rgba(0, 229, 255, .07); }
  .chat-item .titulo {
    flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chat-item .borrar {
    background: none; border: 0; color: var(--suave); padding: 2px 6px; border-radius: 6px; font-size: 13px;
  }
  .chat-item .borrar:hover { color: #ff6b8a; }
  @media (max-width: 700px) {
    #barra { width: 200px; }
  }

  /* ---------- Imágenes ---------- */
  .previa {
    display: flex; align-items: center; gap: 12px; max-width: 860px; margin: 0 auto 10px;
    padding: 8px; background: var(--bg2); border: 1px solid var(--cian-suave); border-radius: 14px;
  }
  .previa[hidden] { display: none !important; }
  #previaImg { height: 56px; width: auto; border-radius: 8px; border: 1px solid var(--borde); }
  .previa .boton { margin-left: auto; }
  .msg-img { display: block; max-width: 100%; max-height: 320px; border-radius: 12px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 600px) {
    .msg { max-width: 88%; font-size: 14px; }
    header { padding: 10px 14px; }
  }
  /* ---------- Celular y tablet ---------- */
  @media (max-width: 900px) {
    #barra { width: 220px; }
  }
  @media (max-width: 700px) {
    #cuerpo { flex-direction: column; }
    #barra {
      width: 100%; max-height: 150px; border-right: 0; border-bottom: 1px solid var(--borde);
      padding: 10px 12px; gap: 8px;
    }
    #barra h3 { display: none; }
    #nuevaChat { width: auto; align-self: flex-start; padding: 8px 14px; }
    #listaChats { flex-direction: row; overflow-x: auto; overflow-y: hidden; gap: 8px; padding-bottom: 4px; }
    .chat-item { min-width: 170px; max-width: 220px; flex-shrink: 0; }
    .msg { max-width: 92%; }
    #chat { padding: 16px 10px; }
    #entrada { padding: 10px; }
    #entrada .fila { padding: 6px 6px 6px 10px; }
    #enviar { padding: 10px 14px; }
    .previa { margin: 0 0 8px; }
    .login-robot { width: 110px; height: 110px; border-radius: 34px; }
    #login-container h2 { font-size: 22px; }
    header .marca b { font-size: 15px; }
    header { padding: 10px 12px; }
  }
  @media (max-width: 380px) {
    #enviar { padding: 10px; }
    .boton { padding: 7px 10px; font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
[hidden] { display: none !important; }
.chip-modo {
  display: inline-block; margin: 0 0 8px 8px; padding: 4px 12px; border-radius: 999px;
  font-size: 13px; color: #7dd3fc; border: 1px solid #7dd3fc; background: rgba(0, 212, 255, 0.12);
  user-select: none;
}
.menu-modos { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 8px 8px; }
.menu-modos .boton { font-size: 13px; padding: 6px 12px; }
</style>
</head>
<body>

<header>
  <div class="avatar robot">
    <div class="auricular"></div>
    <div class="pantalla" style="inset:20% 16%;border-radius:8px;"></div>
    <div class="ojos"><div class="ojo"></div><div class="ojo der"></div></div>
  </div>
  <div class="marca">
    <b>Eloboth</b>
    <div class="estado"><span class="punto"></span><span id="userInfo">Sesión no iniciada</span></div>
  </div>
  <button class="boton" id="logoutBtn" type="button" style="display:none;">Salir</button>
</header>

<div id="cuerpo">
<aside id="barra">
  <button class="boton principal" id="nuevaChat" type="button">+ Nueva conversación</button>
  <h3>Conversaciones</h3>
  <div id="listaChats"></div>
</aside>
<section id="principal">
<div id="login-container">
  <div class="login-robot robot">
    <div class="auricular"></div>
    <div class="pantalla"></div>
    <div class="ojos"><div class="ojo"></div><div class="ojo der"></div></div>
  </div>
  <h2>¡Hola! Soy Eloboth</h2>
  <p>Agente inteligente con análisis sintáctico palabra por palabra y memoria persistente en Firestore.</p>
  <input class="campo" id="nombreUsuario" type="text" placeholder="Escribe tu nombre">
  <button class="boton principal" id="loginBtn" type="button">Iniciar sesión</button>
</div>

<main id="chat"><div id="mensajes"></div></main>

<form id="entrada">
  <div id="previa" class="previa" hidden>
    <img id="previaImg" alt="Vista previa">
    <button type="button" class="boton" id="quitarImg">Quitar</button>
  </div>
  <div id="chipModo" class="chip-modo" hidden></div>
  <div id="menuModos" class="menu-modos" hidden>
    <button type="button" class="boton" data-modo="normal">Chat normal</button>
    <button type="button" class="boton" data-modo="cuadro">Crear cuadro comparativo</button>
    <button type="button" class="boton" data-modo="cuento">Crear cuento</button>
  </div>
  <div class="fila">
    <button type="button" class="boton" id="adjuntar" title="Adjuntar archivo">📎</button>
    <input type="file" id="archivoInput" hidden>
    <textarea id="texto" rows="1" placeholder="Escribe tu mensaje o: Aprende que X significa Y"></textarea>
    <button type="button" class="boton" id="modosBtn" title="Elegir modo">Modos</button>
    <button class="boton principal" id="enviar" type="submit">Enviar</button>
  </div>
</form>
</section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDrOCa17n2IqDH4_UcBmFHLejsxfh4Ihcs",
  authDomain: "elboth-server.firebaseapp.com",
  projectId: "elboth-server",
  storageBucket: "elboth-server.firebasestorage.app",
  messagingSenderId: "73743894774",
  appId: "1:73743894774:web:0f8c2e98c94da1535044d7",
};

let db = null;
try {
  db = getFirestore(initializeApp(FIREBASE_CONFIG));
} catch (e) {
  console.warn("Error al conectar con Firestore:", e);
}

const loginContainer = document.getElementById("login-container");
const chatSection = document.getElementById("chat");
const entradaForm = document.getElementById("entrada");
const userInfo = document.getElementById("userInfo");
const logoutBtn = document.getElementById("logoutBtn");
const loginBtn = document.getElementById("loginBtn");
const nombreInput = document.getElementById("nombreUsuario");
const mensajes = document.getElementById("mensajes");
const texto = document.getElementById("texto");
const chipModo = document.getElementById("chipModo");
const menuModos = document.getElementById("menuModos");
let modoActivo = null; // null = chat normal; si no, el modo queda fijo hasta cambiarlo
const MODOS = {
  cuadro: { prefijo: "crear cuadro comparativo", etiqueta: "Crear cuadro comparativo" },
  cuento: { prefijo: "crear cuento", etiqueta: "Crear cuento" },
};
function fijarModo(clave) {
  modoActivo = MODOS[clave] || null;
  chipModo.hidden = !modoActivo;
  if (modoActivo) chipModo.textContent = modoActivo.etiqueta + " (automático)";
  menuModos.hidden = true;
  texto.focus();
}
document.getElementById("modosBtn").onclick = () => { menuModos.hidden = !menuModos.hidden; };
menuModos.querySelectorAll("[data-modo]").forEach((b) => {
  b.onclick = () => fijarModo(b.dataset.modo);
});

// Almacenamiento seguro: si localStorage está bloqueado (iframes, modo privado),
// usa memoria para que el inicio de sesión funcione igualmente.
const almacen = (() => {
  try {
    localStorage.setItem("__test__", "1");
    localStorage.removeItem("__test__");
    return localStorage;
  } catch (e) {
    const mem = {};
    return {
      getItem: (k) => (k in mem ? mem[k] : null),
      setItem: (k, v) => { mem[k] = String(v); },
      removeItem: (k) => { delete mem[k]; },
    };
  }
})();

let usuarioActual = almacen.getItem("eloboth_usuario");

const MINI_ROBOT = `<div class="mini-robot robot"><div class="auricular"></div><div class="pantalla"></div><div class="ojos"><div class="ojo"></div><div class="ojo der"></div></div></div>`;

function actualizarInterfaz() {
  document.body.classList.toggle("con-sesion", !!usuarioActual);
  if (usuarioActual) {
    userInfo.textContent = `Usuario: ${usuarioActual}`;
    loginContainer.style.display = "none";
    chatSection.style.display = "block";
    entradaForm.style.display = "block";
    logoutBtn.style.display = "inline-block";
  } else {
    userInfo.textContent = "Sesión no iniciada";
    loginContainer.style.display = "flex";
    chatSection.style.display = "none";
    entradaForm.style.display = "none";
    logoutBtn.style.display = "none";
  }
}

nombreInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") loginBtn.click();
});

loginBtn.onclick = () => {
  const val = nombreInput.value.trim();
  if (!val) {
    nombreInput.placeholder = "Primero escribe tu nombre";
    nombreInput.focus();
    return;
  }
  usuarioActual = val;
  almacen.setItem("eloboth_usuario", usuarioActual);
  nombreInput.value = "";
  cargarChats();
  actualizarInterfaz();
  renderizarBarra();
  renderizarMensajes();
  if (!chatActual().mensajes.length) {
    agregarMensaje(`¡Hola, ${usuarioActual}! Soy Eloboth. Estoy listo para procesar e ir aprendiendo nuevos conceptos.`, "eloboth");
  }
};

logoutBtn.onclick = () => {
  almacen.removeItem("eloboth_usuario");
  usuarioActual = null;
  mensajes.innerHTML = "";
  estado = { activo: null, chats: [] };
  listaChats.innerHTML = "";
  actualizarInterfaz();
};

// ---------- Conversaciones (guardadas en este navegador, por usuario) ----------
const listaChats = document.getElementById("listaChats");
let estado = { activo: null, chats: [] };
const TITULO_BASE = "Nueva conversación";

function claveChats() { return "eloboth_chats_" + usuarioActual; }

function guardarChats() {
  try {
    almacen.setItem(claveChats(), JSON.stringify(estado));
  } catch (e) {
    console.warn("No se pudieron guardar las conversaciones:", e);
  }
}

function nuevoId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function chatActual() {
  return estado.chats.find((c) => c.id === estado.activo);
}

function cargarChats() {
  try {
    estado = JSON.parse(almacen.getItem(claveChats())) || { activo: null, chats: [] };
  } catch (e) {
    estado = { activo: null, chats: [] };
  }
  if (!Array.isArray(estado.chats)) estado.chats = [];
  if (estado.chats.length === 0) {
    estado.chats.push({ id: nuevoId(), titulo: TITULO_BASE, mensajes: [] });
  }
  if (!estado.chats.some((c) => c.id === estado.activo)) {
    estado.activo = estado.chats[0].id;
  }
  guardarChats();
}

function renderizarBarra() {
  listaChats.innerHTML = "";
  for (const c of estado.chats) {
    const item = document.createElement("div");
    item.className = "chat-item" + (c.id === estado.activo ? " activo" : "");
    const titulo = document.createElement("span");
    titulo.className = "titulo";
    titulo.textContent = c.titulo;
    const borrar = document.createElement("button");
    borrar.className = "borrar";
    borrar.type = "button";
    borrar.title = "Eliminar conversación";
    borrar.textContent = "✕";
    borrar.onclick = (e) => {
      e.stopPropagation();
      eliminarChat(c.id);
    };
    item.append(titulo, borrar);
    item.onclick = () => cambiarChat(c.id);
    listaChats.appendChild(item);
  }
}

function renderizarMensajes() {
  mensajes.innerHTML = "";
  const c = chatActual();
  if (c) c.mensajes.forEach((m) => pintarMensaje(m.texto, m.clase));
  chatSection.scrollTop = chatSection.scrollHeight;
}

function cambiarChat(id) {
  estado.activo = id;
  guardarChats();
  renderizarBarra();
  renderizarMensajes();
}

function crearChat() {
  const chat = { id: nuevoId(), titulo: TITULO_BASE, mensajes: [] };
  estado.chats.unshift(chat);
  cambiarChat(chat.id);
  texto.focus();
}

function eliminarChat(id) {
  const idx = estado.chats.findIndex((c) => c.id === id);
  if (idx === -1) return;
  estado.chats.splice(idx, 1);
  if (estado.chats.length === 0) {
    estado.chats.push({ id: nuevoId(), titulo: TITULO_BASE, mensajes: [] });
  }
  if (estado.activo === id) estado.activo = estado.chats[0].id;
  guardarChats();
  renderizarBarra();
  renderizarMensajes();
}

document.getElementById("nuevaChat").onclick = () => crearChat();

function agregarMensaje(textoMsj, clase) {
  const transitorio = clase.includes("pensando");
  const fila = pintarMensaje(textoMsj, clase);
  if (!transitorio) {
    const c = chatActual();
    if (c) {
      if (clase === "usuario" && c.titulo === TITULO_BASE && textoMsj) {
        c.titulo = textoMsj.slice(0, 32) + (textoMsj.length > 32 ? "…" : "");
      }
      c.mensajes.push({ texto: textoMsj, clase });
      guardarChats();
      renderizarBarra();

}

function pintarMensaje(textoMsj, clase) {
  const fila = document.createElement("div");
  fila.className = "fila-msg " + (clase === "usuario" ? "usuario" : "");
  if (clase !== "usuario") fila.insertAdjacentHTML("beforeend", MINI_ROBOT);
  const div = document.createElement("div");
  div.className = "msg " + clase;
  if (clase.includes("svg")) {
    div.innerHTML = textoMsj; // solo dibujos predefinidos del código
  } else {
    div.textContent = textoMsj;
  }
  fila.appendChild(div);

  // Si el mensaje trae un bloque HTML, se puede ejecutar aislado en un marco dentro de la página
  const bloqueHtml = !clase.includes("svg") && textoMsj.match(/```html\n([\s\S]*?)\n```/);
  if (bloqueHtml) {
    const contenedor = document.createElement("div");
    const boton = document.createElement("button");
    boton.type = "button";
    boton.className = "boton";
    boton.style.marginTop = "10px";
    boton.textContent = "▶ Ejecutar en esta página";
    boton.onclick = () => {
      if (contenedor.firstChild) {
        contenedor.innerHTML = "";
        boton.textContent = "▶ Ejecutar en esta página";
      } else {
        const marco = document.createElement("iframe");
        marco.setAttribute("sandbox", "allow-scripts");
        marco.srcdoc = bloqueHtml[1];
        marco.style.cssText = "width:100%;height:360px;border:1px solid var(--borde);border-radius:12px;margin-top:10px;background:#fff;";

        boton.textContent = "✖ Ocultar";
      }
    };
    div.appendChild(boton);
    div.appendChild(contenedor);
  }
  mensajes.appendChild(fila);
  chatSection.scrollTop = chatSection.scrollHeight;
  return fila;
}

function normalizarTexto(str) {
  return str
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\s]/g, "")
    .trim();
}

function tokenizarPalabras(str) {
  const norm = normalizarTexto(str);
  return norm ? norm.split(/\s+/) : [];
}

  pres: "presente de indicativo",
  pret: "pretérito indefinido",
  imp: "pretérito imperfecto",
  fut: "futuro simple",
  cond: "condicional simple"
};
const TERM_FUT = ["é", "ás", "á", "emos", "éis", "án"];
const TERM_COND = ["ía", "ías", "ía", "íamos", "íais", "ían"];
const TERM_IMP_AR = ["aba", "abas", "aba", "ábamos", "abais", "aban"];

function construirIndiceConjugaciones() {
  const indice = new Map();
  const agregar = (forma, verbo, tiempo, i) => {
    const k = normalizarTexto(forma);
    if (!indice.has(k)) indice.set(k, []);
    indice.get(k).push({ verbo, tiempo, persona: PERSONAS[i] });
  };

  for (const [verbo, d] of Object.entries(CONJUGACIONES)) {
    const raizBase = verbo.slice(0, -2);
    const raizFut = d.fut || verbo;
    const formas = {
      pres: d.pres.split(" "),
      pret: d.pret.split(" "),
      imp: d.imp
        ? d.imp.split(" ")
        : (verbo.endsWith("ar") ? TERM_IMP_AR : ["ía", "ías", "ía", "íamos", "íais", "ían"]).map((t) => raizBase + t),
      fut: TERM_FUT.map((t) => raizFut + t),
      cond: TERM_COND.map((t) => raizFut + t)
    };
    for (const tiempo of Object.keys(formas)) {
      formas[tiempo].forEach((forma, i) => agregar(forma, verbo, tiempo, i));
    }
  }
  return indice;
}

const INDICE_CONJ = construirIndiceConjugaciones();

// ---------- Interpretación palabra por palabra ----------
// La memoria se lee de Firestore una sola vez por sesión y después se consulta en local
let memoriaCache = null;
async function cargarMemoriaMapa() {
  if (memoriaCache) return memoriaCache;
  const mapa = new Map();
  memoriaCache = mapa;
  if (!db) return mapa;
  try {
    const snap = await getDocs(collection(db, "eloboth_aprendizajes"));
    snap.docs.forEach((d) => {
      const data = d.data();
      if (data.palabra) mapa.set(normalizarTexto(data.palabra), data.definicion);
    });
  } catch (err) {
    console.error("Error al cargar la memoria:", err);
    memoriaCache = null;
  }
  return mapa;
}

function significadosDePalabra(palabra, memoria) {
  const out = [];
  if (memoria.has(palabra)) {
    out.push({ fuente: "memoria", texto: memoria.get(palabra) });
  }
  const hits = INDICE_CONJ.get(palabra);
  if (hits) {
    out.push({
      fuente: "conjugación",
      texto: hits.map((h) => `${TIEMPOS[h.tiempo]}, ${h.persona} de ${h.verbo}`).join("; ")
    });
  }
  return out;
}

async function interpretarOracion(msgOriginal) {
  const palabrasOriginales = msgOriginal.split(/\s+/).filter(Boolean);
  const memoria = await cargarMemoriaMapa();
  const conocidas = [];
  const desconocidas = [];

  for (const original of palabrasOriginales) {
    const norm = normalizarTexto(original);
    if (!norm) continue;
    const sig = significadosDePalabra(norm, memoria);
    if (sig.length) {
      conocidas.push({ palabra: original, sig });
    } else {
      desconocidas.push(original);
    }
  }

  if (conocidas.length === 0) return null;

  const detalle = conocidas.map((c) => `• "${c.palabra}": ${c.sig.map((s) => s.texto).join(" | ")}`);
  const combinado = conocidas.map((c) => c.sig[0].texto).join(" + ");

  const PALABRAS_INTERROGATIVAS = ["que", "quien", "quienes", "cual", "cuales", "como", "donde", "adonde", "cuando", "cuanto", "cuanta", "cuantos", "cuantas", "por", "para"];
  const primera = normalizarTexto(palabrasOriginales[0] || "");
  const esPregunta = PALABRAS_INTERROGATIVAS.includes(primera) || msgOriginal.includes("?");
  const tipo = esPregunta ? "pregunta" : "enunciado";
  const contexto = esPregunta
    ? "Estás preguntando por algo; busco la definición de cada palabra para responder."
    : "Es una afirmación; reviso el significado de cada palabra para entenderla.";

  let resp = `🧩 Análisis de tu ${tipo}\n\n📝 Palabra por palabra:\n${detalle.join("\n")}`;
  resp += `\n\n🔗 Significado combinado: ${combinado}`;
  resp += `\n\n🧭 Contexto: ${contexto}`;
  if (desconocidas.length) {
    resp += `\n\n❓ No conozco: ${desconocidas.map((d) => `"${d}"`).join(", ")}. Puedes enseñármelas con "Aprende que X significa Y".`;
  } else {
    resp += "\n\n✅ Conozco todas las palabras de tu oración.";
  }
  return resp;
}

const PALABRAS_VACIAS = ["la", "el", "los", "las", "un", "una", "unos", "unas", "de", "del", "al", "a", "y", "o", "en", "por", "para", "con", "le", "lo", "me", "te", "se", "su", "sus", "mi", "tu", "que", "es", "fue", "son", "era", "eso", "esto", "esa", "ese"];

// Toma la última frase de palabras desconocidas, que suele ser el tema de la pregunta
function temaDesconocido(palabras, memoria) {
  const tema = [];
  for (let i = palabras.length - 1; i >= 0; i--) {
    const limpia = palabras[i].replace(/[¿?¡!.,;:]/g, "");
    const n = normalizarTexto(limpia);
    if (!n) continue;
    if (PALABRAS_VACIAS.includes(n)) {
      if (tema.length) break;
      continue;
    }
    if (significadosDePalabra(n, memoria).length) break;
    tema.unshift(limpia);
  }
  return tema.length ? tema.join(" ") : null;
}

async function buscarDiccionario(palabra) {
  const p = (palabra || "").trim();
  if (!p || /\s/.test(p)) return null;
  const url = `https://es.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&redirects=1&titles=${encodeURIComponent(p)}&format=json&origin=*`;
  const r = await fetch(url);
  if (!r.ok) return null;
  const datos = await r.json();
  const paginas = datos?.query?.pages || {};
  const pagina = Object.values(paginas)[0];
  if (!pagina || pagina.missing !== undefined || !pagina.extract) return null;
  // Si es una página de desambiguación, no sirve como significado
  if (/puede referirse|puede hacer referencia/i.test(pagina.extract)) return null;
  const frases = pagina.extract.replace(/\s+/g, " ").trim().split(/(?<=\.)\s+/);
  const texto = frases.slice(0, 2).join(" ");
  return `📖 ${pagina.title}: ${texto}`;
}

async function buscarDuckDuckGo(tema) {
  const r = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(tema)}&format=json&no_html=1&skip_disambig=1`);
  if (!r.ok) throw new Error(r.status);
  const d = await r.json();
  if (!d.AbstractText) return null;
  return `🔎 ${d.AbstractText}`;
}

  const desconocidas = [];

  for (const original of palabrasOriginales) {
    const norm = normalizarTexto(original);
    if (!norm) continue;
    progreso(`🔎 Analizando "${original}"...`);
    await esperar(350);
    const sig = significadosDePalabra(norm, memoria);
    if (sig.length) {
      conocidas.push({ palabra: original, sig });
      progreso(`✔ "${original}" → ${sig[0].texto}`);
    } else {
      desconocidas.push(original);
      progreso(`❓ "${original}" no está en mi memoria`);
    }
    await esperar(250);
  }

  progreso("🧠 Juntando los significados...");
  await esperar(400);

  const norm = normalizarTexto(msgOriginal);
  const personalPrimero = respuestaPersonal(norm);
  if (personalPrimero) return personalPrimero;
  const PALABRAS_INTERROGATIVAS = ["que", "quien", "quienes", "cual", "cuales", "como", "donde", "adonde", "cuando", "cuanto", "cuanta", "cuantos", "cuantas", "por", "para"];
  const primera = normalizarTexto(palabrasOriginales[0] || "");
  const esPregunta = PALABRAS_INTERROGATIVAS.includes(primera) || msgOriginal.includes("?")
    || palabrasOriginales.some((p) => ["que", "quien", "quienes", "cual", "cuales", "donde", "cuando", "cuanto"].includes(normalizarTexto(p)));

  // "qué es X" / "quién es X" (aunque vaya al medio de la oración): responde con lo que sabe de X
  const pregunta = norm.match(/\b(que|quien|quienes)\s+(es|son)\s+(.+)$/);
  if (pregunta) {
    const sujeto = pregunta[3].trim();
    const nombre = sujeto.replace(/\b\w/g, (c) => c.toUpperCase());
    const definicion = memoria.get(sujeto);
    if (definicion) {
      return `Claro, ${nombre} es ${definicion}. ¿Quieres que te cuente algo más sobre el tema?`;
    }
    const buscado = msgOriginal.trim().replace(/[?¿]/g, "").trim();
    progreso(`🔎 No sé qué es ${nombre}, lo busco...`);
    return await buscarEnRedes(buscado);
  }

  if (esPregunta) {
    const tema = temaDesconocido(palabrasOriginales, memoria);
    if (tema) {
      const buscado = msgOriginal.trim().replace(/[?¿]/g, "").trim();
      progreso(`🔎 No lo sé, lo busco...`);
      return await buscarEnRedes(buscado);
    }
  }
  // Palabras desconocidas sin pregunta: sugerir buscarlas en redes sociales
  if (conocidas.length === 0 && desconocidas.length) {
    const tema = desconocidas.join(" ");
    return `No conozco "${tema}". Si quieres, pregúntame qué significa y lo busco.`;
  }
  if (conocidas.length === 0) return null;

  const combinado = conocidas.map((c) => c.sig[0].texto).join(" + ");
  // Solo da definiciones si la persona las pide explícitamente
  const pideDefinicion = /\b(que significa|que quiere decir|significa|definicion de|que son)\b/.test(norm);
  if (pideDefinicion) {
    const conDefinicion = conocidas.filter((c) => c.sig.some((s) => s.fuente === "memoria"));
    if (conDefinicion.length) {
      const frases = conDefinicion.map((c) => {
        const mem = c.sig.find((s) => s.fuente === "memoria");
        return `${c.palabra} significa ${mem.texto}`;
      });
      return `${frases.join(". ")}.`;
    }
  }

  // Conversación normal: responder sin definiciones
  if (desconocidas.length) {
    // Busca el significado de cada palabra desconocida en DuckDuckGo
    const partes = [];
    for (const d of desconocidas.slice(0, 3)) {
      progreso(`🔎 Buscando "${d}"...`);
      let info = null;
      try { info = await buscarDiccionario(d); } catch (e) { info = null; }
      if (!info) { try { info = await buscarDuckDuckGo(`significado ${d}`); } catch (e) { info = null; } }
      partes.push(info
        ? `"${d}": ${info}`
        : `"${d}": no encontré su significado. Puedes enseñármelo: Aprende que ${d} significa ...`);
    }
    return partes.join("\n\n");
  }
  return "Entendido. ¿Quieres que te explique alguna de esas palabras?";
}

// Página HTML a partir de la descripción: toma el tema (después de "de", "sobre" o "para") y un color opcional
function generarPaginaHtml(descripcion) {
  const COLORES = { azul: "#1a4a8a", rojo: "#c62828", verde: "#2e7d32", amarillo: "#f9a825", morado: "#6a1b9a", negro: "#111111", rosa: "#ad1457" };
  const partes = descripcion.split(/\s+/);
  const normPartes = partes.map((p) => normalizarTexto(p));
  const color = normPartes.find((p) => COLORES[p]);
  const fondo = color ? COLORES[color] : "#1a4a8a";

  const inicio = normPartes.findIndex((p) => ["de", "sobre", "para"].includes(p));
  let temaPalabras = inicio >= 0 ? partes.slice(inicio + 1) : [];
  temaPalabras = temaPalabras.filter((p) => !COLORES[normalizarTexto(p)]);
  if (temaPalabras.length && ["una", "un", "el", "la"].includes(normalizarTexto(temaPalabras[0]))) {
    temaPalabras.shift();
  }
  const tema = temaPalabras.join(" ").trim();
  const titulo = (tema ? tema.charAt(0).toUpperCase() + tema.slice(1) : "Mi página")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  return `<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${titulo}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; background: ${fondo}; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    h1 { font-size: 2.5rem; margin-bottom: 8px; }
    p { max-width: 560px; line-height: 1.6; opacity: .9; }
    button { margin-top: 20px; padding: 12px 24px; border: 0; border-radius: 10px; background: #fff; color: ${fondo}; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <h1>${titulo}</h1>
  <p>Bienvenido a ${titulo.toLowerCase()}. Edita este texto para describir tu proyecto.</p>
  <button onclick="alert('¡Gracias por visitarnos!')">Saber más</button>
</body>
</html>`;
}

function escaparTexto(t) {
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

async function construirCuadro(texto) {
  let t = texto.replace(/^\s*(de|sobre|entre)\s+/i, "").trim();
  let sobre = "Comparación";
  const mSobre = t.match(/\s+sobre\s+(.+)$/i);
  if (mSobre) { sobre = mSobre[1].trim(); t = t.slice(0, mSobre.index).trim(); }
  const cols = t.split(/\s+(?:y|vs\.?|contra|o)\s+/i).map((x) => x.trim()).filter(Boolean).slice(0, 4);
  if (cols.length < 2) return null;
  const defs = await Promise.all(cols.map((x) => buscarMemoriaAprendida(x)));
  const filas = [
    ["Qué es", defs.map((d) => (d ? escaparTexto(d) : "—"))],
    ["Para qué sirve", cols.map(() => "—")],
    ["Ventajas", cols.map(() => "—")],
    ["Desventajas", cols.map(() => "—")],
  ];
  const cabecera = "<tr><th></th>" + cols.map((c) => `<th>${escaparTexto(c)}</th>`).join("") + "</tr>";
  const cuerpo = filas.map(([nombre, celdas]) =>
    `<tr><th>${nombre}</th>` + celdas.map((c) => `<td>${c}</td>`).join("") + "</tr>").join("\n");
  const html = `<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:system-ui,sans-serif;padding:12px;background:#f4f8ff}
h2{color:#1d4ed8}table{border-collapse:collapse;width:100%}
th,td{border:1px solid #93c5fd;padding:8px;text-align:left;vertical-align:top}
th{background:#dbeafe}tbody th{width:28%}</style></head><body>
<h2>${escaparTexto(sobre)}</h2>
<table><thead>${cabecera}</thead><tbody>${cuerpo}</tbody></table>
</body></html>`;
  return `📊 Cuadro comparativo de ${cols.join(" y ")} sobre ${sobre}. Lo que no sé lo dejo en "—" para que lo completes:\n\n\`\`\`html\n${html}\n\`\`\``;
}

  finales: ["y al final aprendieron que la amistad vale más que cualquier tesoro", "y juntos resolvieron el misterio", "y desde entonces nunca dejaron de explorar"],

const EMOJIS_CUENTO = {
  perro: "🐶", gato: "🐱", mar: "🌊", bosque: "🌲", arboles: "🌳", ciudad: "🏙️", granja: "🐄",
  mapa: "🗺️", sonido: "🔊", puerta: "🚪", amistad: "🤝", tesoro: "💎", misterio: "🔍",
  juguete: "🧸", sol: "☀️", nina: "👧", nino: "🧒", luces: "💡", explorar: "🧭", amigo: "👫",
};

function corregirTexto(t) {
  let r = t.replace(/\s+/g, " ").trim();
  r = r.replace(/(^|[.!?]\s+)([a-záéíóúñ])/g, (m, a, b) => a + b.toUpperCase());
  r = r.replace(/\s+([,.!?])/g, "$1");
  if (!/[.!?]$/.test(r)) r += ".";
  return r;
}

function agregarEmojis(t) {
  return t.replace(/[A-Za-zÁÉÍÓÚáéíóúñÑ]+/g, (w) => {
    const e = EMOJIS_CUENTO[normalizarTexto(w)];
    return e ? `${w} ${e}` : w;
  });
}

// IA de Google (Gemini). Pon aquí una clave gratis de Google AI Studio.
// Si queda vacía, Eloboth usa su cuento de plantilla.
const GEMINI_API_KEY = "";
const GEMINI_MODELO = "gemini-2.5-flash";

async function crearCuentoGemini() {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODELO}:generateContent?key=${GEMINI_API_KEY}`;
  const r = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{ parts: [{ text: "Escribe un cuento corto, creativo y bien escrito en español, con emojis. Solo el cuento, con un título." }] }],
    }),
  });
  if (!r.ok) throw new Error(r.status);
  const datos = await r.json();
  const texto = datos?.candidates?.[0]?.content?.parts?.map((p) => p.text).join("").trim();
  if (!texto) throw new Error("respuesta vacía");
  return `🤖 Respuesta de la IA de Google:\n\n${texto}`;
}

async function crearCuento() {
  if (GEMINI_API_KEY) {
    try {
      return await crearCuentoGemini();
    } catch (e) {
      return "No pude conectar con la IA de Google en este momento. Te dejo un cuento de mi propia plantilla:\n\n" + crearCuentoPlantilla();
    }
  }
  return crearCuentoPlantilla();
}

function crearCuentoPlantilla() {
  const elegir = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const borrador = `${elegir(CUENTO_BASES.personajes)} ${elegir(CUENTO_BASES.lugares)}. Un día ${elegir(CUENTO_BASES.problemas)}. ` +
    `Decidió investigar y, en el camino, conoció a un nuevo amigo ${elegir(CUENTO_BASES.finales)}.`;
  const cuento = agregarEmojis(corregirTexto(borrador));
  return `📖 Cuento corto\n\n${cuento} ✨`;
}

async function procesarComando(msgOriginal) {
  const norm = normalizarTexto(msgOriginal);
  const palabras = tokenizarPalabras(msgOriginal);

  // 1. Saludo estricto
  if (norm === "hola") {
    return "¡Hola!";
  }

  // 1b. Respuesta a la oferta de buscar
  if (busquedaPendiente) {
    const tema = busquedaPendiente;
    busquedaPendiente = null;
    if (/^(si|sip|claro|dale|busca|buscalo|buscala|ok|okay|por favor)\b/.test(norm)) {
      return await buscarEnRedes(tema);
    }
    if (/^(no|nop|no gracias|mejor no)\b/.test(norm)) {
      return "Está bien. Si quieres, pregúntame otra cosa.";
    }
  }

  // 1a. Cambiar de "modelo" (solo cambia la etiqueta que muestra Eloboth)
  const mModelo = msgOriginal.match(/^\s*(?:cambia|cambiar|cambiame|pon|pone|usa|usar)\s+(?:el\s+)?modelo(?:\s+a|\s+por)?\s*(.*)$/i);
  if (mModelo) {
    const nuevo = mModelo[1].trim();
    if (!nuevo) {
      return `Mi modelo actual es ${modeloActual}. Puedo cambiar a: Eloboth Bajo, Eloboth Medio o Eloboth Alto. Dime cuál quieres.`;
    }
    modeloActual = nuevo.replace(/\b\w/g, (c) => c.toUpperCase());
    return `Listo, cambié mi modelo a ${modeloActual}. Ahora respondo con ese modelo.`;
  }
  if (/^(que|cual) modelo (usas|eres|tienes)\b/.test(norm)) {
    return `Estoy usando ${modeloActual}.`;
  }

  // 1c. Crear cuadro comparativo o cuento (sin buscar en internet)
  if (modoCreacion === "cuadro") {
    modoCreacion = null;
    return (await construirCuadro(msgOriginal)) ||
      "No entendí qué comparar. Escribe algo como: perro y gato sobre animales de casa.";
  }
  if (/^crear cuadro\b/.test(norm)) {
    const resto = msgOriginal.replace(/^\s*crear\s+cuadro(\s+comparativo)?/i, "").trim();
    if (!resto) {
      modoCreacion = "cuadro";
      return "¿Qué quieres comparar y sobre qué? Por ejemplo: perro y gato sobre animales de casa.";
    }
    return (await construirCuadro(resto)) ||
      "No entendí qué comparar. Escribe algo como: perro y gato sobre animales de casa.";
  }
  if (/^crear cuento\b/.test(norm)) {
    return await crearCuento();
  }

  // 2. Aprendizaje ("Aprende que X significa Y"), una por línea
  const lineas = msgOriginal.split("\n");
  const resultadosAprendizaje = [];

  for (const linea of lineas) {
    const matchAprende = linea.trim().match(/^aprende que\s+(.+?)\s+significa\s+(.+)$/i);
    if (matchAprende) {
      const palabra = matchAprende[1].trim();
      const definicion = matchAprende[2].trim();
      const res = await guardarAprendizajeFirestore(palabra, definicion);
      if (res.ok) {
        resultadosAprendizaje.push(`✅ Guardado: "${palabra}" -> "${definicion}"`);
      } else {
        resultadosAprendizaje.push(`❌ Error al guardar "${palabra}": ${res.error}`);
      }
    }
  }

  if (resultadosAprendizaje.length > 0) {
    return resultadosAprendizaje.join("\n");
  }

  // 2a. Preguntas personales y conversación (no son preguntas de definición)
  const personal = respuestaPersonal(norm);
  if (personal) return personal;

  // 2b. Análisis del archivo adjunto (por ejemplo "analiza el archivo")
  const VERBOS_ARCHIVO = ["analiza", "analizar", "analisis", "revisa", "revisar", "resume", "resumen", "resumir", "describe", "describir", "lee", "leer", "contenido", "dice", "explica", "explicar"];
  if (palabras.some((p) => ["archivo", "adjunto", "documento"].includes(p) || VERBOS_ARCHIVO.includes(p))) {
    if (archivoActual) return analizarArchivo(archivoActual);
    if (palabras.some((p) => ["archivo", "adjunto", "documento"].includes(p))) {

<body>
  <h2>Snake</h2>
  <canvas id="c" width="400" height="400"></canvas>
  <p id="pts">Puntos: 0 · Usa las flechas (haz clic en el juego primero)</p>
  <script>
    const c = document.getElementById("c"), g = c.getContext("2d"), T = 20, N = 20;
    let cuerpo, dir, comida, pts, vivo, loop;
    function reiniciar() {
      cuerpo = [{ x: 10, y: 10 }];
      dir = { x: 1, y: 0 };
      pts = 0; vivo = true;
      ponerComida();
      clearInterval(loop);
      loop = setInterval(paso, 120);
    }
    function ponerComida() {
      do {
        comida = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
      } while (cuerpo.some((s) => s.x === comida.x && s.y === comida.y));
    }
    function paso() {
      if (!vivo) return;
      const cab = { x: cuerpo[0].x + dir.x, y: cuerpo[0].y + dir.y };
      if (cab.x < 0 || cab.y < 0 || cab.x >= N || cab.y >= N || cuerpo.some((s) => s.x === cab.x && s.y === cab.y)) {
        vivo = false;
        clearInterval(loop);
        document.getElementById("pts").textContent = "Game over · Puntos: " + pts + " · Pulsa Enter para reiniciar";
        return;
      }
      cuerpo.unshift(cab);
      if (cab.x === comida.x && cab.y === comida.y) { pts++; ponerComida(); } else { cuerpo.pop(); }
      dibujar();
      document.getElementById("pts").textContent = "Puntos: " + pts;
    }
    function dibujar() {
      g.fillStyle = "#0d1330";
      g.fillRect(0, 0, c.width, c.height);
      g.fillStyle = "#ff4d6d";
      g.fillRect(comida.x * T, comida.y * T, T - 2, T - 2);
      cuerpo.forEach((s, i) => {
        g.fillStyle = i === 0 ? "#00e5ff" : "#6c4cff";
        g.fillRect(s.x * T, s.y * T, T - 2, T - 2);
      });
    }
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !vivo) { reiniciar(); return; }
      const m = { ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 }, ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 } }[e.key];
      if (m && !(m.x === -dir.x && m.y === -dir.y)) { dir = m; e.preventDefault(); }
    });
    reiniciar();
    dibujar();
  <\/script>
</body>
</html>`,
    enlace: `<a href="https://www.ejemplo.com" target="_blank">Visita el sitio</a>`,
    imagen: `<img src="imagen.jpg" alt="Descripción de la imagen" width="300">`,
    parrafo: `<p>Este es un párrafo de ejemplo.</p>`,
    pagina: `<!DOCTYPE html>\n<html lang="es">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>Mi página</title>\n</head>\n<body>\n  <h1>¡Hola!</h1>\n  <p>Esta es mi primera página.</p>\n</body>\n</html>`
  };
  const pideEscribir = /\b(escriba|escribe|escribir|crea|crear|cree|genera|genere|generar|haz|hazme|dame|quiero|quieres|puedes)\b/.test(norm);
  if (palabras.includes("html") && pideEscribir) {
    let clave = Object.keys(PLANTILLAS_HTML).find((k) => palabras.includes(k));
    if (!clave && palabras.includes("link")) clave = "enlace";
    if (!clave) clave = "pagina";
    const nombre = clave === "pagina" ? "una página" : clave;
    return `Aquí tienes HTML de ${nombre}:\n\`\`\`html\n${clave === "pagina" ? generarPaginaHtml(msgOriginal) : PLANTILLAS_HTML[clave]}\n\`\`\``;
  }

  // 5. Generador de código "print"
  if (palabras.includes("print") || palabras.includes("imprimir") || palabras.includes("muestra")) {
    if (palabras.includes("html")) return `Estructura HTML:\n\`\`\`html\n<h1>¡Hola!</h1>\n\`\`\``;
    if (palabras.includes("javascript") || palabras.includes("js")) return `Código JavaScript:\n\`\`\`javascript\nconsole.log("¡Hola!");\n\`\`\``;
    if (palabras.includes("lua")) return `Script Lua:\n\`\`\`lua\nprint("¡Hola!")\n\`\`\``;
    if (palabras.includes("c") || palabras.includes("cpp")) return `Código C++:\n\`\`\`cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    cout << "¡Hola!" << endl;\n    return 0;\n}\n\`\`\``;
  }

  // 6. Consulta en memoria de Firestore (oración completa o palabras clave)
  const memoriaOracion = await buscarMemoriaAprendida(msgOriginal);
  if (memoriaOracion) return `💡 Definición aprendida:\n"${memoriaOracion}"`;

  // Solo para una palabra; en oraciones lo maneja el análisis completo (paso 8)
  for (const p of palabras.length === 1 ? palabras : []) {
    if (p.length > 2) {
      const memoriaPalabra = await buscarMemoriaAprendida(p);
      if (memoriaPalabra) {
        return `💡 Sobre "${p}" tengo registrado:\n"${memoriaPalabra}"`;
      }
    }
  }

  // 6b. Conjugación de una sola palabra (no interfiere con frases)
  if (palabras.length === 1) {
    const hits = INDICE_CONJ.get(palabras[0]);
    if (hits) {
      const lista = hits.map((h) => `${TIEMPOS[h.tiempo]}, ${h.persona} de ${h.verbo}`);
      return `🔤 "${msgOriginal.trim()}":\n${lista.join("\n")}`;
    }
  }

  // 7. Respuestas conversacionales
  if (norm === "que es eso" || (palabras.includes("que") && palabras.includes("es") && palabras.includes("eso"))) {
    return "Analizando tu consulta [Palabras: 'que', 'es', 'eso'] -> Es una expresión para solicitar la definición de un objeto o concepto. Si deseas enseñarme uno, escribe: 'Aprende que [palabra] significa [definición]'.";
  }
  if (norm === "como estas" || (palabras.includes("como") && palabras.includes("estas"))) {
    return `¡Todo excelente por aquí! ¿Y tú, ${usuarioActual}, cómo estás?`;
  }
  if (norm === "bien y tu" || (palabras.includes("bien") && palabras.includes("tu"))) {
    return "¡Me alegro mucho! Yo estoy genial, listo para ayudarte.";
  }
  if (palabras.includes("gracias")) {
    return `¡De nada, ${usuarioActual}! Es un gusto ayudar.`;
  }

  // 8. Interpretación de la oración con las palabras que conoce
  if (palabras.length > 1 || msgOriginal.includes("?")) {
    const interpretacion = await responderOracion(msgOriginal);
    if (interpretacion) return interpretacion;
  }

  return `Entendido. He analizado las ${palabras.length} palabras de tu mensaje ("${palabras.join('", "')}"). No tengo un registro guardado sobre esta consulta. Puedes enseñármelo escribiendo: "Aprende que ${msgOriginal} significa [tu definición]".`;
}

// ---------- Imágenes pegadas (Ctrl+V / Cmd+V) ----------
let imagenPendiente = null;
const previa = document.getElementById("previa");
const previaImg = document.getElementById("previaImg");

function limpiarImagen() {
  imagenPendiente = null;
  previa.hidden = true;
  previaImg.removeAttribute("src");
}
document.getElementById("quitarImg").onclick = limpiarImagen;

texto.addEventListener("paste", (e) => {
  const items = Array.from(e.clipboardData?.items || []);
  const item = items.find((it) => it.type.startsWith("image/"));
  if (!item) return;
  const file = item.getAsFile();
  if (!file) return;
  e.preventDefault();

  const reader = new FileReader();
  reader.onload = () => {
    const url = reader.result;
    const img = new Image();
    img.onload = () => {
      imagenPendiente = { url, ancho: img.naturalWidth, alto: img.naturalHeight, tipo: file.type };
      previaImg.src = url;
      previa.hidden = false;
      texto.focus();
    };
    img.src = url;
  };
  reader.readAsDataURL(file);
});

function agregarImagen(imagen, textoExtra = "") {
  const fila = agregarMensaje(textoExtra || "📷 Imagen pegada", "usuario");
  const div = fila.querySelector(".msg");
  const img = document.createElement("img");
  img.src = imagen.url;
  img.alt = "Imagen pegada";
  img.className = "msg-img";
  div.textContent = "";
  div.appendChild(img);
  if (textoExtra) {
    const p = document.createElement("div");
    p.textContent = textoExtra;
    p.style.marginTop = "8px";

}

// ---------- Archivos adjuntos ----------
let archivoActual = null;
const TEXTO_EXT = ["txt", "md", "csv", "json", "js", "html", "htm", "css", "svg", "xml", "py", "lua", "c", "cpp", "h", "java", "ts", "log", "ini", "yml", "yaml"];

function analizarArchivo(a) {
  const ext = (a.nombre.split(".").pop() || "").toLowerCase();
  const lineas = [
    `📄 Archivo: ${a.nombre}`,
    `🗂️ Tipo: ${a.tipo || ext || "desconocido"} · ${(a.tamano / 1024).toFixed(1)} KB`
  ];

  if (a.url) {
    lineas.push(`🖼️ Imagen de ${a.ancho}×${a.alto} px. Todavía no puedo describir lo que muestra.`);
    return lineas.join("\n");
  }
  if (a.texto === null) {
    lineas.push("No puedo leer el contenido de este tipo de archivo; solo muestro sus datos.");
    return lineas.join("\n");
  }

  const filas = a.texto.split("\n");
  const numPalabras = a.texto.trim() ? a.texto.trim().split(/\s+/).length : 0;
  lineas.push(`📏 ${filas.length} líneas · ${numPalabras} palabras · ${a.texto.length} caracteres`);

  if (ext === "json") {
    try {
      const obj = JSON.parse(a.texto);
      const detalle = Array.isArray(obj)
        ? `lista de ${obj.length} elementos`
        : `objeto con claves: ${Object.keys(obj).slice(0, 10).join(", ")}`;
      lineas.push(`✅ JSON válido: ${detalle}`);
    } catch (e) {
      lineas.push(`❌ El JSON no es válido: ${e.message}`);
    }
  }
  if (["html", "htm"].includes(ext)) {
    lineas.push(`🏷️ Etiquetas HTML aproximadas: ${(a.texto.match(/<[a-zA-Z]/g) || []).length}`);
  }
  if (["js", "lua", "py", "c", "cpp", "java", "ts"].includes(ext)) {
    const funciones = (a.texto.match(/function\s+\w+|def\s+\w+|local function\s+\w+/g) || []).length;
    lineas.push(`🧩 Funciones detectadas: ${funciones}`);
  }

  const primeras = filas.map((l) => l.trim()).filter(Boolean).slice(0, 5);
  if (primeras.length) {
    lineas.push("👀 Primeras líneas:\n" + primeras.map((l) => `  ${l.slice(0, 120)}`).join("\n"));
  }
  return lineas.join("\n");
}

async function recibirArchivo(file) {
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  const esImagen = file.type.startsWith("image/");
  const esTexto = !esImagen && (TEXTO_EXT.includes(ext) || file.type.startsWith("text/") || file.type === "application/json");
  const info = { nombre: file.name, tipo: file.type, tamano: file.size, texto: null, url: null, ancho: null, alto: null };

  if (esTexto) {
    info.texto = await file.slice(0, 200000).text();
  }
  if (esImagen) {
    info.url = await new Promise((res) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.readAsDataURL(file);
    });
    await new Promise((res) => {
      const img = new Image();
      img.onload = () => { info.ancho = img.naturalWidth; info.alto = img.naturalHeight; res(); };
      img.src = info.url;
    });
    agregarImagen(info);
  } else {
    agregarMensaje(`📎 ${file.name} (${(file.size / 1024).toFixed(1)} KB)`, "usuario");
  }

  archivoActual = info;
  agregarMensaje(`Archivo recibido. Escribe "analiza el archivo", "resume el archivo" o "qué dice el archivo".`, "eloboth");
}

document.getElementById("adjuntar").onclick = () => document.getElementById("archivoInput").click();
document.getElementById("archivoInput").onchange = (e) => {
  const f = e.target.files[0];
  e.target.value = "";

  try {

    pensando.remove();

    agregarMensaje(`Error en el procesamiento: ${err.message}`, "eloboth");
  }
};
